name: Update VEX IQ game manual

on:
  schedule:
    - cron: "17 9 * * *"   # every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Find and download the newest manual
        run: python scripts/update_manual.py
      - name: Commit if the manual changed
        run: |
          if [ -n "$(git status --porcelain manual/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manual/
            git commit -m "Update VEX IQ game manual"
            git push
          else
            echo "Manual unchanged."
          fi
